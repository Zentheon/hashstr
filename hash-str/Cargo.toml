# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
authors = ["Zentheon <zentheon@mailbox.org>"]
edition = "2024"
name = "hash-str"
description = "Convenient string-like types that wrap RustCrypto hashers"
version = "0.1.0"
readme = "../README.md"
repository = "https://github.com/Zentheon/hash-str"
homepage = "https://github.com/Zentheon/hash-str"
license-file = "../LICENSE"

[features]
default = ["tracing", "serde"]
tracing = ["dep:tracing"]
serde = ["dep:serde"]
ascon-hash256 = ["dep:ascon-hash256"]
bash-hash = ["dep:bash-hash"]
belt-hash = ["dep:belt-hash"]
blake2 = ["dep:blake2"]
blake3 = ["dep:blake3"]
fsb = ["dep:fsb"]
gost94 = ["dep:gost94"]
groestl = ["dep:groestl"]
jh = ["dep:jh"]
kupyna = ["dep:kupyna"]
md2 = ["dep:md2"]
md4 = ["dep:md4"]
md5 = ["dep:md-5"]
ripemd = ["dep:ripemd"]
sha1 = ["dep:sha1"]
sha1-checked = ["dep:sha1-checked"]
sha2 = ["dep:sha2"]
sha3 = ["dep:sha3"]
shabal = ["dep:shabal"]
skein = ["dep:skein"]
sm3 = ["dep:sm3"]
streebog = ["dep:streebog"]
tiger = ["dep:tiger"]
whirlpool = ["dep:whirlpool"]

[dependencies]
hash-str-derive = "0.1.0"
fstr = "0.2.17"
generic-array = "1.3.5"
serde = { version = "1.0.219", optional = true }
tracing = { version = "0.1.41", optional = true }
constant_time_eq = "0.5.0"
digest = "0.11.2"
digest-io = "0.1.0"
base16ct = { version = "1.0.0", features = ["alloc"] }
blake2 = { version = "0.10.6", optional = true }
blake3 = { version = "1.8.4", features = ["digest"], optional = true }
md2 = { version = "0.11.0", optional = true }
md4 = { version = "0.11.0", optional = true }
md-5 = { version = "0.11.0", optional = true }
ripemd = { version = "0.2.0", optional = true }
sha1-checked = { version = "0.10.0", optional = true }
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
sha3 = { version = "0.11.0", optional = true }
shabal = { version = "0.5.0", optional = true }
skein = { version = "0.2.0", optional = true }
sm3 = { version = "0.5.0", optional = true }
streebog = { version = "0.11.0", optional = true }
tiger = { version = "0.3.0", optional = true }
whirlpool = { version = "0.11.0", optional = true }
kupyna = { version = "0.1.0", optional = true }
jh = { version = "0.2.0", optional = true }
groestl = { version = "0.11.0", optional = true }
gost94 = { version = "0.11.0", optional = true }
fsb = { version = "0.2.0", optional = true }
belt-hash = { version = "0.2.1", optional = true }
bash-hash = { version = "0.1.0", optional = true }
ascon-hash256 = { version = "0.1.0", optional = true }
hybrid-array = "0.4.11"
const-hex = "1.18.1"
