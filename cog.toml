from_latest_tag = false
ignore_merge_commits = false
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = [
    "echo '{{version}}' '{{from}}' '{{version+major}}' '{{version}}+minor' '{{version}}+{{minor}}'",
    "cargo test --all-features",
    "bump-crate {{version}} */Cargo.toml",
    "bump-dep hashstr {{version}} */Cargo.toml",
    "bump-dep hashstr-derive {{version}} */Cargo.toml",
    "cargo check",
]
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
template = "./.dev/changelog-template.tera"
authors = [
    { username = "Zentheon", signature = "Zentheon" }
]
