name: Build, test and publish release

# TODO: Figure out how to IO built binaries.

# This workflow has two jobs:
# crates-publish:
#   Publish the crate to crates.io and creates a build artifact for github-publish
#
# github-publish:
#   Fetches build-artifact and checks out CHANGELOG.md. Retrieves the changelog section relating to
#   the pushed tag and creates a new release with those inputs.

on:
  push:
    tags: [ '[1-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read

jobs:
  crates-publish:
      runs-on: ubuntu-latest
      environment: release
      permissions:
        id-token: write # Required for OIDC token exchange
      steps:
      - uses: actions/checkout@v6

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            CHANGELOG.md

  github-release:
    needs: crates-publish
    runs-on: ubuntu-latest
    name: Create Github release
    permissions:
      contents: write
    steps:
      - name: Retrieve built package
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Extract changelog to body file
        run: |
          awk '/^## ${{ github.ref_name }}/ {flag=1; next} /^- - -/ {flag=0} flag' CHANGELOG.md > release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            CHANGELOG.md
