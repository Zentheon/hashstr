# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "hashstr"
description = "Convenient string-like types that wrap RustCrypto hashers"
keywords = ["string", "sha", "hash", "digest"]
categories = ["cryptography", "parsing"]
version = "0.3.0"
edition = "2024"
authors = ["Zentheon <zentheon@mailbox.org>"]
readme = "./README.md"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Zentheon/hashstr"
homepage = "https://github.com/Zentheon/hashstr"

[features]
default = ["std", "tracing"]
std = ["alloc", "blake3/std", "sha1-checked/std"]
alloc = []
tracing = ["dep:tracing"]
serde = ["fstr/serde"]
ascon-hash256 = ["dep:ascon-hash256"]
bash-hash = ["dep:bash-hash"]
belt-hash = ["dep:belt-hash"]
blake2 = ["dep:blake2"]
blake3 = ["dep:blake3"]
fsb = ["dep:fsb"]
gost94 = ["dep:gost94"]
groestl = ["dep:groestl"]
jh = ["dep:jh"]
kupyna = ["dep:kupyna"]
md2 = ["dep:md2"]
md4 = ["dep:md4"]
md5 = ["dep:md-5"]
ripemd = ["dep:ripemd"]
sha1 = ["dep:sha1"]
sha1-checked = ["dep:sha1-checked"]
sha2 = ["dep:sha2"]
sha3 = ["dep:sha3"]
shabal = ["dep:shabal"]
skein = ["dep:skein"]
sm3 = ["dep:sm3"]
streebog = ["dep:streebog"]
tiger = ["dep:tiger"]
whirlpool = ["dep:whirlpool"]

[dependencies]
hashstr-derive = { path = "../hashstr-derive", version = "0.3.0" }
fstr = { version = "0.2.22", default-features = false }
generic-array = "1.3.5"
tracing = { version = "0.1.41", optional = true, default-features = false }
constant_time_eq = "0.5.0"
digest = { version = "0.11.2", default-features = false }
digest-io = "0.1.0"
blake2 = { version = "0.10.6", optional = true, default-features = false }
blake3 = { version = "1.8.4", optional = true, default-features = false, features = ["digest"] }
md2 = { version = "0.11.0", optional = true, default-features = false }
md4 = { version = "0.11.0", optional = true, default-features = false }
md-5 = { version = "0.11.0", optional = true, default-features = false }
ripemd = { version = "0.2.0", optional = true, default-features = false }
sha1-checked = { version = "0.10.0", optional = true, default-features = false }
sha1 = { version = "0.11.0", optional = true, default-features = false }
sha2 = { version = "0.11.0", optional = true, default-features = false }
sha3 = { version = "0.12.0", optional = true, default-features = false }
shabal = { version = "0.5.0", optional = true, default-features = false }
skein = { version = "0.2.0", optional = true, default-features = false }
sm3 = { version = "0.5.0", optional = true , default-features = false }
streebog = { version = "0.11.0", optional = true, default-features = false }
tiger = { version = "0.3.0", optional = true, default-features = false }
whirlpool = { version = "0.11.0", optional = true, default-features = false }
kupyna = { version = "0.1.0", optional = true, default-features = false }
jh = { version = "0.2.0", optional = true, default-features = false }
groestl = { version = "0.11.0", optional = true, default-features = false }
gost94 = { version = "0.11.0", optional = true, default-features = false }
fsb = { version = "0.2.0", optional = true, default-features = false }
belt-hash = { version = "0.2.1", optional = true, default-features = false }
bash-hash = { version = "0.1.0", optional = true, default-features = false }
ascon-hash256 = { version = "0.1.0", optional = true, default-features = false }
hybrid-array = "0.4.11"
base64ct = "1.8.3"
base16ct = "1.0.0"
base32ct = "0.3.1"
serde = { version = "1.0.228", default-features = false }

[dev-dependencies]
const-hex = "1.18.1"
tracing-test = "0.2.6"
