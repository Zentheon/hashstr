[package]
authors = ["Zentheon <zentheon@mailbox.org>"]
edition = "2024"
name = "hash-str-derive"
description = "Derive macro magic behind the hash-str crate"
version = "0.1.0"
readme = "../README.md"
repository = "https://github.com/Zentheon/hash-str"
homepage = "https://github.com/Zentheon/hash-str"
license-file = "../LICENSE"

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
darling = "0.23.0"
proc-macro-error = "1.0.4"
